        <h1>CLEARED.</h1>
        <section lang="id">
          <h2>Berkas beres. Hutan habis.</h2>
          <p>Di meja, namanya izin. Di rumah, namanya asap.</p>
          <p>
            Rapat selesai. Mesin masuk. Pohon tumbang, tunggul berbaris, lalu api mengerjakan
            sisanya. Asap menyeberangi batas resmi dan masuk ke rumah warga. Tidak ikut rapat,
            tidak ikut untung. Tetap kebagian menghirup hasilnya.
          </p>
          <p>Sepotong daun hangus kembali ke peta. Katanya sudah beres. Daun ini tidak setuju.</p>
        </section>
        <section lang="en">
          <h2>Paperwork done. Forest gone.</h2>
          <p>In the office, it's a permit. At home, it's smoke.</p>
          <p>
            The meeting ends. Machines arrive. Trees fall, stumps line up, and fire handles the
            rest. Smoke crosses the official boundary and enters a family's home. No seat at the
            meeting. No share of the profit. Plenty to breathe in.
          </p>
          <p>A charred leaf returns to the map. They called it settled. This leaf disagrees.</p>
        </section>
      </main>
